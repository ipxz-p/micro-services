x-postgres: &postgres
  image: postgres:16.3-alpine
  restart: unless-stopped
  env_file:
    - .env

x-kafka-config: &kafka-config
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-kafka-healthcheck: &kafka-healthcheck
  test:
    [
      "CMD-SHELL",
      "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
    ]
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 45s

services:
  user_db:
    <<: *postgres
    container_name: user_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${USER_SERVICE_DB_HOST_PORT:-5433}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DB ของ notification-service — ตั้งใจใช้ user/password/db คนละชื่อกับ
  # user_db ผ่าน environment ตรงนี้ (ไม่ใช้ *postgres-healthcheck ร่วม เพราะ
  # anchor นั้นอ่าน ${POSTGRES_USER}/${POSTGRES_DB} ตัวเดียวกับ user_db)
  notification_db:
    <<: *postgres
    container_name: notification_db
    environment:
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
    ports:
      - "${NOTIFICATION_SERVICE_DB_HOST_PORT:-5438}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIFICATION_POSTGRES_USER} -d ${NOTIFICATION_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: apache/kafka:3.9.0
    hostname: kafka-1
    container_name: kafka-1
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_1_HOST_PORT}:9092"
    environment:
      <<: *kafka-config
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:29092,CONTROLLER://kafka-1:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_1_HOST_PORT}
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:3.9.0
    hostname: kafka-2
    container_name: kafka-2
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_2_HOST_PORT}:9092"
    environment:
      <<: *kafka-config
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:29092,CONTROLLER://kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_2_HOST_PORT}
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:3.9.0
    hostname: kafka-3
    container_name: kafka-3
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_3_HOST_PORT}:9092"
    environment:
      <<: *kafka-config
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:29092,CONTROLLER://kafka-3:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_3_HOST_PORT}
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka_ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # เปิดไว้เพื่อให้ `curl -X POST :9090/-/reload` โหลด config ใหม่ได้
      # โดยไม่ต้อง restart container ทั้งตัว
      - --web.enable-lifecycle
    # บน Linux ชื่อ host.docker.internal ไม่มีมาให้เหมือน Docker Desktop
    # บรรทัดนี้ทำให้ scrape config ชุดเดียวใช้ได้ทั้ง macOS และ Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # local dev เท่านั้น — ปิดหน้า login จะได้ไม่ต้องพิมพ์รหัสทุกครั้ง
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  user_db_data:
  notification_db_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  prometheus_data:
  grafana_data:
