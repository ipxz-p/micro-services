x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.node-app
  restart: unless-stopped
  env_file:
    - .env
  profiles: [apps]

x-app-env: &app-env
  NODE_ENV: production
  KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  USER_SERVICE_GRPC_URL: user-service:50051
  AUTH_SERVICE_GRPC_URL: auth-service:50052

services:
  api-gateway:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node-app
      args:
        APP: api-gateway
    container_name: api_gateway
    ports:
      - "${API_GATEWAY_HTTP_PORT:-3000}:3000"
    environment:
      <<: *app-env
      API_GATEWAY_HTTP_PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

  auth-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node-app
      args:
        APP: auth-service
    container_name: auth_service
    environment:
      <<: *app-env
      AUTH_SERVICE_GRPC_PORT: 50052
      AUTH_SERVICE_HEALTH_PORT: 3052
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3052/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      user-service:
        condition: service_healthy

  user-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node-app
      args:
        APP: user-service
    container_name: user_service
    environment:
      <<: *app-env
      USER_SERVICE_GRPC_PORT: 50051
      USER_SERVICE_HEALTH_PORT: 3051
      USER_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user_db:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3051/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      user_db:
        condition: service_healthy
      kafka-1:
        condition: service_healthy

  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node-app
      args:
        APP: notification-service
    container_name: notification_service
    environment:
      <<: *app-env
      NOTIFICATION_SERVICE_HEALTH_PORT: 3060
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3060/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka-1:
        condition: service_healthy
