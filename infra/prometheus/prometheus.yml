global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus เก็บ metric ของตัวเองด้วย — ใช้เช็คว่า Prometheus ยังมีชีวิตอยู่
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # service ทั้งหมดใน project
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: api-gateway

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3051"]
        labels:
          service: user-service

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3052"]
        labels:
          service: auth-service

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3060"]
        labels:
          service: notification-service
